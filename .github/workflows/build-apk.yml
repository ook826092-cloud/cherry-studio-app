name: 编译 APK (ARM64-v8a Release)

on:
  schedule:
    - cron: '10 16,4 * * *'
  workflow_dispatch:

concurrency:
  group: build-apk
  cancel-in-progress: true

permissions:
  contents: write
  issues: write

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 90

    steps:
      # 用 API 判断 12 小时内有无新提交，先于拉代码，跳过时省去整个 checkout
      - name: 检查最近12小时有无新提交（API 先判）
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "${{ github.event_name }}" == "schedule" ]; then
            SINCE=$(date -u -d '12 hours ago' +%Y-%m-%dT%H:%M:%SZ)
            # API 异常时按“有提交”处理（宁可多编译一次，不可漏发版）
            COUNT=$(gh api "repos/${{ github.repository }}/commits?sha=v0.2&since=$SINCE&per_page=100" --jq 'length' 2>/dev/null || echo 1)
            if [ "$COUNT" -eq 0 ]; then
              echo "skip=true" >> "$GITHUB_OUTPUT"
              echo "⏭️ 12小时内无新提交，跳过本次编译"
            else
              echo "skip=false" >> "$GITHUB_OUTPUT"
              echo "✅ 12小时内有 $COUNT 次提交，继续编译"
            fi
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
            echo "👆 手动触发，继续编译"
          fi

      - if: steps.check.outputs.skip != 'true'
        name: 拉取代码（浅克隆）
        uses: actions/checkout@v4
        with:
          ref: v0.2
          fetch-depth: 1

      - if: steps.check.outputs.skip != 'true'
        name: 安装 pnpm
        uses: pnpm/action-setup@v4

      # Node 版本与 package.json engines（24.x）对齐
      - if: steps.check.outputs.skip != 'true'
        name: 安装 Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      # 注意：上游 Expo SDK 若升级到要求 JDK 21 的 AGP 版本，把这里改成 21
      - if: steps.check.outputs.skip != 'true'
        name: 安装 Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      # GitHub 官方镜像已自带 Android SDK 且 license 已接受，无需 setup-android
      - if: steps.check.outputs.skip != 'true'
        name: 安装依赖 + 构建工作区包 + 生成安卓原生代码
        run: |
          pnpm install --frozen-lockfile
          pnpm packages:build
          npx expo prebuild --platform android --clean
        env:
          EXPO_ANDROID_KEYSTORE_PASSWORD: ""
          EXPO_ANDROID_KEY_PASSWORD: ""

      - if: steps.check.outputs.skip != 'true'
        name: 调优 Gradle 编译（加大内存 / 并行 / 构建缓存）
        run: |
          # 先补一个换行再追加，防止 gradle.properties 末尾没有换行符导致内容粘连（曾污染 buildToolsVersion 导致编译失败）
          printf '\norg.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=1g\norg.gradle.parallel=true\norg.gradle.caching=true\n' >> android/gradle.properties
          echo '--- 追加后的 gradle.properties 末尾 ---'
          tail -5 android/gradle.properties

      - if: steps.check.outputs.skip != 'true'
        name: 配置 Gradle 缓存（自动计算 key + 清理过期缓存）
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-home-cache-cleanup: true

      - if: steps.check.outputs.skip != 'true'
        name: 配置签名密钥 + 开启 R8 混淆
        run: python3 scripts/fix_build_gradle.py
        env:
          KEYSTORE_B64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}

      - if: steps.check.outputs.skip != 'true'
        name: 写入 ProGuard 混淆规则
        run: python3 scripts/write_proguard.py

      - if: steps.check.outputs.skip != 'true'
        name: 编译 ARM64-v8a Release APK
        run: |
          cd android
          export SIGNING_STORE_PASSWORD="${{ secrets.SIGNING_STORE_PASSWORD }}"
          export SIGNING_KEY_ALIAS="${{ secrets.SIGNING_KEY_ALIAS }}"
          export SIGNING_KEY_PASSWORD="${{ secrets.SIGNING_KEY_PASSWORD }}"
          ./gradlew :app:assembleRelease -PreactNativeArchitectures=arm64-v8a

      - if: steps.check.outputs.skip != 'true'
        name: 查找编译出的 APK
        id: find-apk
        run: |
          APK=$(find android/app/build/outputs/apk/release -name "*.apk" | head -1)
          echo "找到 APK: $APK"
          ls -lh "$APK"
          file "$APK"
          echo "apk-path=$APK" >> "$GITHUB_OUTPUT"

      - if: steps.check.outputs.skip != 'true'
        name: 立即备份 APK 到 Actions 工件（防丢）
        uses: actions/upload-artifact@v4
        with:
          name: cherry-studio-arm64-v8a-release
          path: ${{ steps.find-apk.outputs.apk-path }}
          retention-days: 7

      - if: steps.check.outputs.skip != 'true'
        name: 生成 Release 标签名
        id: tag
        run: |
          TAG="build-$(TZ=Asia/Shanghai date +%Y%m%d-%H%M%S)"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "标签: ${TAG}"

      - if: steps.check.outputs.skip != 'true'
        name: 创建 Release + 上传 APK（自动创建 tag）
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: Cherry Studio ${{ steps.tag.outputs.tag }}
          body: |
            Cherry Studio ARM64-v8a Release APK
            架构: arm64-v8a | R8混淆: 开启 | 签名: 自定义密钥
            自动编译于 GitHub Actions
          files: ${{ steps.find-apk.outputs.apk-path }}
          draft: false
          prerelease: true
          make_latest: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # 构建失败时自动建 Issue（按 runId 去重，重跑不会重复建）
      - name: 构建失败自动建 Issue
        if: failure()
        continue-on-error: true
        uses: actions/github-script@v7
        with:
          script: |
            // 仓库未启用 Issues 时跳过（避免报错）
            const repo = await github.rest.repos.get({ owner: context.repo.owner, repo: context.repo.repo });
            if (!repo.data.has_issues) {
              console.log('仓库未启用 Issues，跳过自动建 Issue');
              return;
            }
            const title = `⛔ APK 构建失败 #${context.runId}`;
            const q = `repo:${context.repo.owner}/${context.repo.repo} type:issue state:open in:title "${title}"`;
            const { data: search } = await github.rest.search.issuesAndPullRequests({ q });
            if (search.total_count > 0) {
              console.log('已存在相同 Issue，跳过');
              return;
            }
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title,
              body: [
                '构建失败详情：',
                `- 触发方式：${context.eventName}`,
                `- 分支：${context.ref}`,
                `- 运行日志：${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
                '',
                '本 Issue 由 Actions 自动创建，构建成功后请手动关闭。',
              ].join('\n')
            });
