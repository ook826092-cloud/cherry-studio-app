name: 编译 APK (ARM64-v8a Release)

on:
  schedule:
    - cron: '10 16,4 * * *'
  workflow_dispatch:

concurrency:
  group: build-apk
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: 拉取代码
        uses: actions/checkout@v4
        with:
          ref: v0.2
          fetch-tags: true

      - name: 检查最近12小时有无新提交
        id: check
        run: |
          if [ "${{ github.event_name }}" == "schedule" ]; then
            COMMITS=$(git log --since="12 hours ago" --oneline | wc -l)
            if [ "$COMMITS" -eq 0 ]; then
              echo "skip=true" >> "$GITHUB_OUTPUT"
              echo "⏭️ 12小时内无新提交，跳过本次编译"
            else
              echo "skip=false" >> "$GITHUB_OUTPUT"
              echo "✅ 12小时内有 $COMMITS 次提交，继续编译"
            fi
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
            echo "👆 手动触发，继续编译"
          fi

      - if: steps.check.outputs.skip != 'true'
        name: 安装 pnpm
        uses: pnpm/action-setup@v4

      - if: steps.check.outputs.skip != 'true'
        name: 安装 Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - if: steps.check.outputs.skip != 'true'
        name: 安装 Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - if: steps.check.outputs.skip != 'true'
        name: 安装 Android SDK
        uses: android-actions/setup-android@v3

      - if: steps.check.outputs.skip != 'true'
        name: 安装依赖 + 构建工作区包 + 生成安卓原生代码
        run: |
          pnpm install
          pnpm packages:build
          npx expo prebuild --platform android --clean
        env:
          EXPO_ANDROID_KEYSTORE_PASSWORD: ""
          EXPO_ANDROID_KEY_PASSWORD: ""

      - if: steps.check.outputs.skip != 'true'
        name: 调优 Gradle 编译（加大内存 / 并行 / 构建缓存）
        run: |
          cat >> android/gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=1g
          org.gradle.parallel=true
          org.gradle.caching=true
          EOF

      - if: steps.check.outputs.skip != 'true'
        name: 配置 Gradle 缓存（自动计算 key + 清理过期缓存）
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-home-cache-cleanup: true

      - if: steps.check.outputs.skip != 'true'
        name: 配置签名密钥 + 开启 R8 混淆
        run: python3 scripts/fix_build_gradle.py
        env:
          KEYSTORE_B64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}

      - if: steps.check.outputs.skip != 'true'
        name: 写入 ProGuard 混淆规则
        run: python3 scripts/write_proguard.py

      - if: steps.check.outputs.skip != 'true'
        name: 编译 ARM64-v8a Release APK
        run: |
          cd android
          export SIGNING_STORE_PASSWORD="${{ secrets.SIGNING_STORE_PASSWORD }}"
          export SIGNING_KEY_ALIAS="${{ secrets.SIGNING_KEY_ALIAS }}"
          export SIGNING_KEY_PASSWORD="${{ secrets.SIGNING_KEY_PASSWORD }}"
          ./gradlew :app:assembleRelease -PreactNativeArchitectures=arm64-v8a

      - if: steps.check.outputs.skip != 'true'
        name: 查找编译出的 APK
        id: find-apk
        run: |
          APK=$(find android/app/build/outputs/apk/release -name "*.apk" | head -1)
          echo "找到 APK: $APK"
          echo "apk-path=$APK" >> "$GITHUB_OUTPUT"

      - if: steps.check.outputs.skip != 'true'
        name: 立即备份 APK 到 Actions 工件（防丢）
        uses: actions/upload-artifact@v4
        with:
          name: cherry-studio-arm64-v8a-release
          path: ${{ steps.find-apk.outputs.apk-path }}
          retention-days: 7

      - if: steps.check.outputs.skip != 'true'
        name: 生成 Release 标签名
        id: tag
        run: |
          TAG="build-$(TZ=Asia/Shanghai date +%Y%m%d-%H%M%S)"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "标签: ${TAG}"

      - if: steps.check.outputs.skip != 'true'
        name: 创建 Release + 上传 APK（自动创建 tag）
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: Cherry Studio ${{ steps.tag.outputs.tag }}
          body: |
            Cherry Studio ARM64-v8a Release APK
            架构: arm64-v8a | R8混淆: 开启 | 签名: 自定义密钥
            自动编译于 GitHub Actions
          files: ${{ steps.find-apk.outputs.apk-path }}
          draft: false
          prerelease: true
          make_latest: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
