name: Build APK ARM64 v8a Release

on:
  schedule:
    - cron: '10 16,4 * * *'
  workflow_dispatch:

concurrency:
  group: build-apk
  cancel-in-progress: true

env:
  APK_PATH: android/app/build/outputs/apk/release/app-arm64-v8a-release.apk
  TZ: Asia/Shanghai

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: v0.2
          fetch-tags: true

      - name: Check recent commits
        id: check
        run: |
          if [ "${{ github.event_name }}" == "schedule" ]; then
            COMMITS=$(git log --since="12 hours ago" --oneline | wc -l)
            if [ "$COMMITS" -eq 0 ]; then
              echo "skip=true" >> "$GITHUB_OUTPUT"
              echo "No commits in 12h, skip"
            else
              echo "skip=false" >> "$GITHUB_OUTPUT"
              echo "Found $COMMITS commits, building"
            fi
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
            echo "Manual trigger, building"
          fi

      - name: Setup pnpm
        if: steps.check.outputs.skip != 'true'
        uses: pnpm/action-setup@v4

      - name: Setup Node.js 22
        if: steps.check.outputs.skip != 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Setup Java 17
        if: steps.check.outputs.skip != 'true'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Android SDK
        if: steps.check.outputs.skip != 'true'
        uses: android-actions/setup-android@v3

      - name: Install dependencies
        if: steps.check.outputs.skip != 'true'
        run: |
          pnpm install
          pnpm exec expo --version

      - name: Prebuild Android
        if: steps.check.outputs.skip != 'true'
        run: |
          npx expo prebuild --platform android --clean
        env:
          EXPO_ANDROID_KEYSTORE_PASSWORD: ""
          EXPO_ANDROID_KEY_PASSWORD: ""

      - name: Configure signing and R8
        if: steps.check.outputs.skip != 'true'
        run: |
          echo "${{ secrets.SIGNING_KEYSTORE_BASE64 }}" | base64 -d > android/app/keystore.jks
          python3 << 'HEREDOC'
import re
with open('android/app/build.gradle', 'r') as f:
    c = f.read()
sb = '''
    signingConfigs {
        release {
            storeFile file('keystore.jks')
            storePassword System.getenv('SIGNING_STORE_PASSWORD')
            keyAlias System.getenv('SIGNING_KEY_ALIAS')
            keyPassword System.getenv('SIGNING_KEY_PASSWORD')
        }
    }
'''
c = re.sub(r'(android\s*\{)', r'\1' + sb, c)
c = re.sub(r'(buildTypes\s*\{.*?release\s*\{)', r'\1\n            minifyEnabled true\n            proguardFiles getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro"\n            signingConfig signingConfigs.release', c, flags=re.DOTALL)
with open('android/app/build.gradle', 'w') as f:
    f.write(c)
print('build.gradle updated')
HEREDOC

      - name: Create proguard-rules.pro
        if: steps.check.outputs.skip != 'true'
        run: |
          cat > android/app/proguard-rules.pro << 'HEREDOC'
-keep class com.facebook.react.** { *; }
-keep class com.facebook.hermes.** { *; }
-keep class com.facebook.jni.** { *; }
-keep class expo.** { *; }
-keep class com.facebook.hermes.unicode.** { *; }
-keepattributes *Annotation*
-keepclassmembers class * {
    @com.facebook.react.uimanager.annotations.ReactProp <methods>;
    @com.facebook.react.uimanager.annotations.ReactPropGroup <methods>;
}
-keep class * extends com.facebook.react.ReactPackage { *; }
-dontwarn com.facebook.hermes.**
-dontwarn com.facebook.jni.**
HEREDOC

      - name: Build ARM64-v8a Release APK
        if: steps.check.outputs.skip != 'true'
        run: |
          cd android
          export SIGNING_STORE_PASSWORD="${{ secrets.SIGNING_STORE_PASSWORD }}"
          export SIGNING_KEY_ALIAS="${{ secrets.SIGNING_KEY_ALIAS }}"
          export SIGNING_KEY_PASSWORD="${{ secrets.SIGNING_KEY_PASSWORD }}"
          ./gradlew :app:assembleRelease -PreactNativeArchitectures=arm64-v8a

      - name: Generate release tag
        if: steps.check.outputs.skip != 'true'
        id: tag
        run: |
          TAG="build-$(TZ='Asia/Shanghai' date +'%Y%m%d-%H%M%S')"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"

      - name: Create tag
        if: steps.check.outputs.skip != 'true'
        run: |
          git config user.name "default"
          git config user.email "agent@qwenpaw.ai"
          git tag "${{ steps.tag.outputs.tag }}"
          git push origin "${{ steps.tag.outputs.tag }}"

      - name: Create Release
        if: steps.check.outputs.skip != 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: Cherry Studio ${{ steps.tag.outputs.tag }}
          body: |
            Cherry Studio ARM64-v8a Release APK

            Build: ${{ steps.tag.outputs.tag }}
            Arch: arm64-v8a
            R8: enabled
            Sign: custom keystore

            Auto-built by GitHub Actions
          files: ${{ env.APK_PATH }}
          draft: false
          prerelease: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload APK artifact
        if: steps.check.outputs.skip != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: cherry-studio-arm64-v8a-release
          path: ${{ env.APK_PATH }}
          retention-days: 7
