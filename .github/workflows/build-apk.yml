name: Build APK (ARM64-v8a Release)

on:
  schedule:
    - cron: '10 16,4 * * *'
  workflow_dispatch:

concurrency:
  group: build-apk
  cancel-in-progress: true

env:
  APK_PATH: android/app/build/outputs/apk/release/app-arm64-v8a-release.apk

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: v0.2
          fetch-tags: true

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install dependencies
        run: |
          pnpm install
          pnpm exec expo --version

      - name: Prebuild Android
        run: |
          npx expo prebuild --platform android --clean
        env:
          EXPO_ANDROID_KEYSTORE_PASSWORD: ""
          EXPO_ANDROID_KEY_PASSWORD: ""

      - name: Configure signing, R8 & proguard
        run: |
          # 解码签名文件
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > android/app/keystore.jks

          # 用 Python 注入签名配置和 R8 到 build.gradle
          python3 << 'PYEOF'
import re

with open('android/app/build.gradle', 'r') as f:
    content = f.read()

signing_block = '''
    signingConfigs {
        release {
            storeFile file('keystore.jks')
            storePassword System.getenv('KEYSTORE_PASSWORD')
            keyAlias System.getenv('KEY_ALIAS')
            keyPassword System.getenv('KEY_PASSWORD')
        }
    }
'''

content = re.sub(
    r'(android\s*\{)',
    r'\1' + signing_block,
    content
)

content = re.sub(
    r'(buildTypes\s*\{.*?release\s*\{)',
    r'\1\n            minifyEnabled true\n            proguardFiles getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro"\n            signingConfig signingConfigs.release',
    content,
    flags=re.DOTALL
)

with open('android/app/build.gradle', 'w') as f:
    f.write(content)

print('✅ build.gradle 已更新')
PYEOF

      - name: Create proguard-rules.pro
        run: |
          cat > android/app/proguard-rules.pro << 'EOF'
# React Native
-keep class com.facebook.react.** { *; }
-keep class com.facebook.hermes.** { *; }
-keep class com.facebook.jni.** { *; }

# Expo
-keep class expo.** { *; }

# Hermes
-keep class com.facebook.hermes.unicode.** { *; }

# Keep annotations for native modules
-keepattributes *Annotation*
-keepclassmembers class * {
    @com.facebook.react.uimanager.annotations.ReactProp <methods>;
    @com.facebook.react.uimanager.annotations.ReactPropGroup <methods>;
}

# Keep native modules & packages
-keep class * extends com.facebook.react.ReactPackage { *; }

# Keep JavaScript engine interfaces
-dontwarn com.facebook.hermes.**
-dontwarn com.facebook.jni.**
EOF
          echo "✅ proguard-rules.pro 已创建"

      - name: Build ARM64-v8a Release APK
        run: |
          cd android
          export KEYSTORE_PASSWORD="${{ secrets.KEYSTORE_PASSWORD }}"
          export KEY_ALIAS="${{ secrets.KEY_ALIAS }}"
          export KEY_PASSWORD="${{ secrets.KEY_PASSWORD }}"
          ./gradlew :app:assembleRelease -PreactNativeArchitectures=arm64-v8a

      - name: Generate release tag
        id: tag
        run: |
          TIMESTAMP=$(date -u +'%Y%m%d-%H%M%S')
          TAG="build-${TIMESTAMP}"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "✅ Release tag: ${TAG}"

      - name: Create tag
        run: |
          git config user.name "default"
          git config user.email "agent@qwenpaw.ai"
          git tag "${{ steps.tag.outputs.tag }}"
          git push origin "${{ steps.tag.outputs.tag }}"

      - name: Create Release & Upload APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: Cherry Studio ${{ steps.tag.outputs.tag }}
          body: |
            ## Cherry Studio — ARM64-v8a Release APK

            | 项目 | 值 |
            |------|-----|
            | 📅 编译时间 | `${{ steps.tag.outputs.tag }}` |
            | 🏗 架构 | `arm64-v8a` |
            | ⚡ R8 混淆 | ✅ 已开启 |
            | 🔑 签名 | 自定义密钥签名 |

            ---
            *🤖 自动编译于 GitHub Actions*
          files: |
            ${{ env.APK_PATH }}
          draft: false
          prerelease: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload APK (artifact backup)
        uses: actions/upload-artifact@v4
        with:
          name: cherry-studio-arm64-v8a-release
          path: ${{ env.APK_PATH }}
          retention-days: 7
