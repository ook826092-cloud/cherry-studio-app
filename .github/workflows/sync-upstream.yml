name: Sync Upstream

on:
  schedule:
    - cron: '0 16,4 * * *'
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout v0.2
        uses: actions/checkout@v4
        with:
          ref: v0.2
          fetch-depth: 0

      - name: Fetch upstream
        run: |
          git remote add upstream https://github.com/CherryHQ/cherry-studio-app.git
          git fetch upstream v0.2

      - name: Check for new commits
        id: check
        run: |
          LOCAL=$(git rev-parse HEAD)
          UPSTREAM=$(git rev-parse upstream/v0.2)
          echo "local=$LOCAL"
          echo "upstream=$UPSTREAM"
          if [ "$LOCAL" = "$UPSTREAM" ]; then
            echo "skip=true" >> $GITHUB_OUTPUT
            echo "✅ 上游无新提交，跳过本次同步"
          else
            echo "skip=false" >> $GITHUB_OUTPUT
            echo "🔄 检测到上游有新提交，开始同步"
          fi

      - name: Merge upstream/v0.2
        if: steps.check.outputs.skip == 'false'
        env:
          GIT_AUTHOR_NAME: github-actions
          GIT_AUTHOR_EMAIL: github-actions@github.com
          GIT_COMMITTER_NAME: github-actions
          GIT_COMMITTER_EMAIL: github-actions@github.com
        run: |
          git config --global user.name "${{ env.GIT_AUTHOR_NAME }}"
          git config --global user.email "${{ env.GIT_AUTHOR_EMAIL }}"
          # 合并上游；若因本地删除上游 workflow 触发 modify/delete 冲突，统一保留删除决策
          git merge upstream/v0.2 --no-edit --no-ff || {
            # 解决 .github/workflows/ 下所有 modify/delete 冲突（本地已删除这些 workflow）
            git diff --name-only --diff-filter=U | grep '^\.github/workflows/' | while read -r f; do
              git rm -f "$f"
            done
            # 若有 workflows 之外的未预期冲突，报错暴露
            LEFT=$(git diff --name-only --diff-filter=U | grep -v '^\.github/workflows/')
            if [ -n "$LEFT" ]; then
              echo "❌ 存在未预期冲突:"; echo "$LEFT"; exit 1
            fi
            git commit --no-edit
          }
          # 确保 .github/workflows/ 始终是本地版本（上游 CI 不复活）
          git checkout HEAD^ -- .github/workflows/
          git commit --amend --no-edit
          git push origin v0.2
