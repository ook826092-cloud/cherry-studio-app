name: Sync Upstream

on:
  schedule:
    - cron: '0 0,12 * * *'
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: v0.2
          fetch-depth: 0

      - name: Add upstream remote
        run: |
          git remote add upstream https://github.com/CherryHQ/cherry-studio-app.git
          git fetch upstream

      - name: Sync v0.2 with upstream main
        run: |
          git checkout v0.2
          git merge upstream/main --no-edit --allow-unrelated-histories || true
          git push origin v0.2

      - name: Sync main with upstream main
        run: |
          git checkout main
          git merge upstream/main --no-edit --allow-unrelated-histories || true
          git push origin main
