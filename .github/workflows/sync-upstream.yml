name: Sync Upstream

on:
  schedule:
    - cron: '0 16,4 * * *'
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout v0.2
        uses: actions/checkout@v4
        with:
          ref: v0.2
          fetch-depth: 0

      - name: Fetch upstream
        run: |
          git remote add upstream https://github.com/CherryHQ/cherry-studio-app.git
          git fetch upstream v0.2

      - name: Check for new commits
        id: check
        run: |
          LOCAL=$(git rev-parse HEAD)
          UPSTREAM=$(git rev-parse upstream/v0.2)
          echo "local=$LOCAL"
          echo "upstream=$UPSTREAM"
          if [ "$LOCAL" = "$UPSTREAM" ]; then
            echo "skip=true" >> $GITHUB_OUTPUT
            echo "✅ 上游无新提交，跳过本次同步"
          else
            echo "skip=false" >> $GITHUB_OUTPUT
            echo "🔄 检测到上游有新提交，开始同步"
          fi

      - name: Merge upstream/v0.2
        if: steps.check.outputs.skip == 'false'
        env:
          GIT_AUTHOR_NAME: github-actions
          GIT_AUTHOR_EMAIL: github-actions@github.com
          GIT_COMMITTER_NAME: github-actions
          GIT_COMMITTER_EMAIL: github-actions@github.com
        run: |
          git config --global user.name "${{ env.GIT_AUTHOR_NAME }}"
          git config --global user.email "${{ env.GIT_AUTHOR_EMAIL }}"
          # 合并上游；若因本地删除上游 workflow 触发 modify/delete 冲突，统一保留删除决策
          if git merge upstream/v0.2 --no-edit --no-ff; then
            :
          else
            # 遍历所有未解决冲突：.github/workflows/ 下的保留本地删除，其他报错暴露
            for f in $(git diff --name-only --diff-filter=U); do
              case "$f" in
                .github/workflows/*) git rm -f "$f" ;;
                *) echo "❌ 未预期冲突: $f"; exit 1 ;;
              esac
            done
            git commit --no-edit
          fi
          # 确保 .github/workflows/ 始终是本地版本（上游 CI 不复活）
          git checkout HEAD^ -- .github/workflows/
          git commit --amend --no-edit
          git push origin v0.2
